name: Release
on:
  push:
    tags: ["**"]
jobs:
  package:
    name: Package
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup pnpm
        uses: threeal/setup-pnpm-action@v2.1.0

      - name: Install dependencies
        run: pnpm install

      - name: Package
        run: pnpm pack

      - name: Upload package
        uses: actions/upload-artifact@v7.0.2
        with:
          name: package
          path: "*.tgz"

  draft:
    name: Draft
    needs: package
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download package
        uses: actions/download-artifact@v8.0.2
        with:
          name: package

      - name: Create draft release
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --draft --generate-notes *.tgz
