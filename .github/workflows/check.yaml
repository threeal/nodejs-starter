name: Check
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
jobs:
  pre-commit:
    name: Pre-commit
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup pnpm
        uses: threeal/setup-pnpm-action@v2.1.0

      - name: Setup Lefthook
        uses: threeal/setup-lefthook-action@v1.1.0

      - name: Check pre-commit hook
        run: lefthook run pre-commit --all-files

  test:
    name: Test
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup pnpm
        uses: threeal/setup-pnpm-action@v2.1.0

      - name: Install dependencies
        run: pnpm install

      - name: Test
        run: pnpm vitest run

  package:
    name: Package
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup pnpm
        uses: threeal/setup-pnpm-action@v2.1.0

      - name: Install dependencies
        run: pnpm install

      - name: Package
        run: pnpm pack
